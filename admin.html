<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
    }

    .login {
      max-width: 450px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }

    .logout {
      background: #dc2626;
      float: right;
      margin-top: -40px;
    }

    .submission {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .message {
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }

    .delete {
      background: #dc2626;
      margin-top: 10px;
    }

    #adminPanel {
      display: none;
    }

    #loginMessage {
      color: red;
      margin-top: 10px;
    }

  </style>
</head>

<body>

  <!-- LOGIN -->

  <div class="login" id="loginBox">

    <h2>Admin Login</h2>

    <input
      type="password"
      id="password"
      placeholder="Admin password"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div class="container" id="adminPanel">

    <div class="header">

      <h1>Admin Dashboard</h1>

      <p>
        Submitted messages
      </p>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

    <div id="submissions">
      Loading submissions...
    </div>

  </div>


  <script>

    /*
      IMPORTANT:

      Change this password to match the ADMIN_PASSWORD
      environment variable you create on Render.
    */

    async function login() {

      const password =
        document.getElementById("password").value;

      /*
        The browser cannot safely read the Render
        environment variable directly.

        We therefore verify the password through
        the server.
      */

      try {

        const response = await fetch("/api/admin-login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            password: password
          })

        });

        const data = await response.json();

        if (data.success) {

          localStorage.setItem(
            "adminLoggedIn",
            "true"
          );

          document.getElementById("loginBox").style.display =
            "none";

          document.getElementById("adminPanel").style.display =
            "block";

          loadSubmissions();

        } else {

          document.getElementById("loginMessage").textContent =
            "Incorrect password.";

        }

      } catch (error) {

        document.getElementById("loginMessage").textContent =
          "Server connection error.";

      }

    }


    function logout() {

      localStorage.removeItem("adminLoggedIn");

      location.reload();

    }


    async function loadSubmissions() {

      const container =
        document.getElementById("submissions");

      container.innerHTML =
        "Loading submissions...";

      try {

        const response =
          await fetch("/api/submissions");

        const data =
          await response.json();

        if (!data.success) {

          container.innerHTML =
            "Could not load submissions.";

          return;

        }

        if (data.submissions.length === 0) {

          container.innerHTML =
            "<p>No submissions yet.</p>";

          return;

        }

        container.innerHTML = "";

        data.submissions.forEach(function(item) {

          const div =
            document.createElement("div");

          div.className =
            "submission";

          const message =
            document.createElement("div");

          message.className =
            "message";

          message.textContent =
            item.message;

          const date =
            document.createElement("div");

          date.className =
            "date";

          date.textContent =
            "Submitted: " +
            new Date(item.created_at).toLocaleString();

          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "delete";

          deleteButton.textContent =
            "Delete";

          deleteButton.onclick =
            function() {
              deleteSubmission(item.id);
            };

          div.appendChild(message);
          div.appendChild(date);
          div.appendChild(deleteButton);

          container.appendChild(div);

        });

      } catch (error) {

        container.innerHTML =
          "Unable to connect to server.";

      }

    }


    async function deleteSubmission(id) {

      if (!confirm("Delete this submission?")) {
        return;
      }

      try {

        const response =
          await fetch("/api/submissions/" + id, {
            method: "DELETE"
          });

        const data =
          await response.json();

        if (data.success) {

          loadSubmissions();

        } else {

          alert("Could not delete submission.");

        }

      } catch (error) {

        alert("Server error.");

      }

    }


    // Check login status
    if (
      localStorage.getItem("adminLoggedIn") === "true"
    ) {

      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("adminPanel").style.display =
        "block";

      loadSubmissions();

    }

  </script>

</body>
</html>
